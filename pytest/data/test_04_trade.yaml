- name: 获取合约列表用例-无 token

  steps:
    - request:
        method: GET
        url: http://127.0.0.1:8000/api/contracts
    
    - response: 
        status_code: 401
        json:
          code: 401
          msg: 未登录或 token 失效
          data: null

- name: 下单黄金期货一手，单价 400，然后持仓检查

  steps:
    - db:
        execute: DELETE FROM orders
    - db:
        execute: DELETE FROM positions
    - db:
        execute: DELETE FROM settlements
    - db:
        execute: UPDATE accounts SET cash = 1000000
    - request:
        method: POST
        url: http://127.0.0.1:8000/api/orders
        headers: {
          'Authorization': 'Bearer ${token}'
        }
        json: {
          "contract_code": "AU2508",
          "price": "400.00",
          "quantity": "1",
          "side": "buy"
        }
    
    - response: 
        status_code: 200
        json:
          code: 0
          msg: 下单成功
          data: {
            "amount": 400000.0,
            "contract_code": "AU2508",
            "status": "filled"
          }

    # 方案A：直接断言数据库里持仓的业务期望值（写死，而非回填）
    - db:
        sql: SELECT quantity, avg_price FROM positions WHERE user_id = 1
        expect:
          - quantity: 1
            avg_price: 400.0

    # 方案A：断言账户资金落库结果（100万 - 40万 = 60万）
    - db:
        sql: SELECT cash FROM accounts WHERE user_id = 1
        expect:
          - cash: 600000.0

    - request:
        method: GET
        url: http://127.0.0.1:8000/api/positions
        headers: {
          'Authorization': 'Bearer ${token}'
        }

    - response: 
        status_code: 200
        json:
          code: 0
          msg: success
          data:         
            - quantity: 1
              contract_code: AU2508
              avg_price: 400.0

    - request:
        method: GET
        url: http://127.0.0.1:8000/api/account
        headers: {
          'Authorization': 'Bearer ${token}'
        }

    - response: 
        status_code: 200
        json:
          code: 0
          msg: success
          data:
            cash: 600000.0

- name: 下单黄金期货一手，单价 420，然后持仓检查

  steps:
    - request:
        method: POST
        url: http://127.0.0.1:8000/api/orders
        headers: {
          'Authorization': 'Bearer ${token}'
        }
        json: {
          "contract_code": "AU2508",
          "price": "420.00",
          "quantity": "1",
          "side": "buy"
        }
    
    - response: 
        status_code: 200
        json:
          code: 0
          msg: 下单成功
          data: {
            "amount": 420000.0,
            "contract_code": "AU2508",
            "status": "filled"
          }

    # 方案A：第二次买入后，持仓应为 2 手，加权均价 (400+420)/2 = 410
    - db:
        sql: SELECT quantity, avg_price FROM positions WHERE user_id = 1
        expect:
          - quantity: 2
            avg_price: 410.0

    # 方案A：60万 - 42万 = 18万
    - db:
        sql: SELECT cash FROM accounts WHERE user_id = 1
        expect:
          - cash: 180000.0

    - request:
        method: GET
        url: http://127.0.0.1:8000/api/positions
        headers: {
          'Authorization': 'Bearer ${token}'
        }

    - response: 
        status_code: 200
        json:
          code: 0
          msg: success
          data:         
            - quantity: 2
              contract_code: AU2508
              avg_price: 410.0

- name: 卖出黄金期货一手，单价 410，然后持仓检查

  steps:
    - request:
        method: POST
        url: http://127.0.0.1:8000/api/orders
        headers: {
          'Authorization': 'Bearer ${token}'
        }
        json: {
          "contract_code": "AU2508",
          "price": "410.00",
          "quantity": "1",
          "side": "sell"
        }
    
    - response: 
        status_code: 200
        json:
          code: 0
          msg: 下单成功
          data: {
            "amount": 410000.0,
            "contract_code": "AU2508",
            "status": "filled"
          }

    # 方案A：平掉 1 手后，持仓应剩 1 手，均价不变仍为 410
    - db:
        sql: SELECT quantity, avg_price FROM positions WHERE user_id = 1
        expect:
          - quantity: 1
            avg_price: 410.0

    # 方案A：卖出回补 41万，18万 + 41万 = 59万
    - db:
        sql: SELECT cash FROM accounts WHERE user_id = 1
        expect:
          - cash: 590000.0

    - request:
        method: GET
        url: http://127.0.0.1:8000/api/positions
        headers: {
          'Authorization': 'Bearer ${token}'
        }

    - response: 
        status_code: 200
        json:
          code: 0
          msg: success
          data:         
            - quantity: 1
              contract_code: AU2508
              avg_price: 410.0

    - request:
        method: GET
        url: http://127.0.0.1:8000/api/account
        headers: {
          'Authorization': 'Bearer ${token}'
        }

    - response: 
        status_code: 200
        json:
          code: 0
          msg: success
          data:
            cash: 590000.0


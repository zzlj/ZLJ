- name: 登录成功然后查询用户成功

  steps:
    - request:
        method: GET
        url: http://127.0.0.1:8000/api/users
        headers: {
        'Authorization': 'Bearer ${token}'
        }

    - response:
        status_code: 200
        json:
          code: 0
          msg: success
          data:
            - id: 1
              username: admin
              role: admin
              email: admin@example.com
            
            - id: 2
              username: mysqluser
              role: user
              email: mysql@example.com

- name: 用户查询成功用例-无 token

  steps:
    - request:
        method: GET
        url: http://127.0.0.1:8000/api/users

    - response:
        status_code: 401
        json:
          code: 401

- name: 用户查询失败用例-错误 token

  steps:
    - request:
        method: GET
        url: http://127.0.0.1:8000/api/users
        headers: {
        'Authorization': '123456'
        }

    - response:
        status_code: 401
        json:
          code: 401

- name: 新增用户失败-无用户名

  steps:
    - db:
        execute: 'DELETE from users where username = "whx"'
    - request:
        method: POST
        url: http://127.0.0.1:8000/api/users
        headers: {
        'Authorization': 'Bearer ${token}'
        }
        json: {
          "username": null,
          "password": "111111",
          "email": "whx@qq.com",
          "role": "user"
        }

    - response:
        status_code: 200
        json:
          code: 1
          msg: "用户名和密码不能为空"


name: 登录成功用例

steps:
  - request:
      method: POST
      url: http://127.0.0.1:8000/api/login
      json: {
        'username': 'admin',
        'password': '123456'
      }

  - response:
      status_code: 200
      json:
        code: 0
        msg: 登录成功
        data:
          user:
            username: admin
  
  - extract:
      token: [json,$.data.token]

  - request:            # 第 2 个请求：带 token
      method: POST
      url: http://127.0.0.1:8000/api/login
      json: {
        'username': 'admin',
        'password': '12345'
      }
  - response:
      status_code: 200
      json:
        code: 0

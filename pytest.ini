[pytest]

testpaths = pytest

addopts = --alluredir=temps --clean-alluredir -m api -vs

log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    api: 用例依赖api接口
    web: 用例依赖web接口
    ut: 用例依赖单元测试
    login: 用例依赖登录接口
    pay: 用例依赖支付接口
    ddt: 用例依赖数据驱动测试
